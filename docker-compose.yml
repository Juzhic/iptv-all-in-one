services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: iptv_admin
      POSTGRES_PASSWORD: "__POSTGRES_ADMIN_PASSWORD__"
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: Asia/Shanghai
    # PostgreSQL is reachable by the application over db_internal. This
    # loopback-only publication is optional ingress for a host-side FRP client.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 uses a major-version subdirectory below this mount.
      - postgres_data:/var/lib/postgresql
    # Docker does not activate published ports for a container attached only
    # to internal networks. Keep host ingress separate from application traffic.
    networks:
      - db_host_access
      - db_internal
    # Keep the official root entrypoint so it can prepare a fresh named volume;
    # it drops privileges to postgres before starting the database server.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 128mb
    init: true
    restart: unless-stopped

  postgres-init:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: iptv_admin
      PGPASSWORD: "__POSTGRES_ADMIN_PASSWORD__"
      APP_DB_USER: iptv_app
      APP_DB_PASSWORD: "__POSTGRES_APP_PASSWORD__"
      APP_DB_NAME: iptv_all_in_one
    command:
      - /bin/sh
      - -ec
      - |
        psql --dbname=postgres --set=ON_ERROR_STOP=1 \
          --set=app_user="$${APP_DB_USER}" \
          --set=app_password="$${APP_DB_PASSWORD}" \
          --set=app_database="$${APP_DB_NAME}" <<'SQL'
        SELECT format(
          'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS',
          :'app_user'
        )
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user')
        \gexec
        SELECT format(
          'ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS',
          :'app_user', :'app_password'
        )
        \gexec
        SELECT format(
          'CREATE DATABASE %I OWNER %I ENCODING %L TEMPLATE template0',
          :'app_database', :'app_user', 'UTF8'
        )
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_database')
        \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_database', :'app_user')
        \gexec
        SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'app_database')
        \gexec
        SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'app_database', :'app_user')
        \gexec
        SQL

        psql --dbname="$${APP_DB_NAME}" --set=ON_ERROR_STOP=1 \
          --set=app_user="$${APP_DB_USER}" <<'SQL'
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'app_user')
        \gexec
        SQL
    networks:
      - db_internal
    user: postgres
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"

  iptv-all-in-one:
    image: juzhic/iptv-all-in-one:3.0.2
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: iptv_app
      DB_PASSWORD: "__POSTGRES_APP_PASSWORD__"
      DB_NAME: iptv_all_in_one
      IPTV_AUTH_USERNAME: admin
      IPTV_AUTH_PASSWORD: "__IPTV_AUTH_PASSWORD__"
      IPTV_AUTH_REALM: iptv-all-in-one
      IPTV_SECRET_KEY: "__IPTV_SECRET_KEY__"
      IPTV_TRUSTED_ORIGINS: ""
      IPTV_INSECURE_TLS_HOSTS: ""
      IPTV_OUTPUT_DIR: /app/output
      IPTV_REQUIRE_STRONG_CREDENTIALS: "1"
      IPTV_REQUIRE_DATABASE: "1"
      TZ: Asia/Shanghai
    # The Web UI is intentionally published for LAN/FRP access. Protect it
    # with a firewall, VPN, or TLS reverse proxy; playlist routes stay public.
    ports:
      - "58080:58080"
    volumes:
      - app_data:/app/data
      - app_output:/app/output
    # Put the routable network first for Compose versions that do not support
    # an explicit gateway priority.
    networks:
      - egress
      - db_internal
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
  app_output:

networks:
  db_host_access:
    # Used only by PostgreSQL so its 127.0.0.1 binding is effective. The
    # application and postgres-init services do not join this network.
    driver: bridge
  db_internal:
    internal: true
  egress:
    driver: bridge
