services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    command:
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-64M}
      - --innodb-log-buffer-size=${MYSQL_INNODB_LOG_BUFFER_SIZE:-8M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-50}
      - --table-open-cache=${MYSQL_TABLE_OPEN_CACHE:-200}
      - --table-definition-cache=${MYSQL_TABLE_DEFINITION_CACHE:-400}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      # 1.x used DB_PASSWORD as the MySQL root password. Keep that fallback so
      # an existing volume can boot before the optional 2.0 account migration.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?Run python generate_env.py first}}
      MYSQL_DATABASE: ${DB_NAME:-iptv-all-in-one}
      # Do not pass DB_USER=root to the official image when reusing a 1.x env.
      # These values only initialize a brand-new volume; existing volumes
      # ignore them and continue with their current accounts.
      # MYSQL_INIT_* is intentionally optional. Omitting it keeps legacy
      # DB_USER=root away from the official image's reserved MYSQL_USER input.
      # Fresh deployments get both values from generate_env.py.
      MYSQL_USER: ${MYSQL_INIT_USER:+${MYSQL_INIT_USER}}
      MYSQL_PASSWORD: ${MYSQL_INIT_PASSWORD:+${MYSQL_INIT_PASSWORD}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  iptv-all-in-one:
    image: juzhic/iptv-all-in-one:latest
    container_name: iptv-all-in-one
    command: ["gunicorn", "-w", "1", "--worker-class", "gthread", "--threads", "8", "-b", "0.0.0.0:58080", "--timeout", "120", "web:app"]
    # Security risk: the management UI is intentionally published on every
    # host interface. Protect the host with a firewall/VPN/reverse proxy.
    # Playlist download endpoints intentionally remain anonymous for clients
    # without BasicAuth support, so anyone reaching this port can read them.
    ports:
      - "${PORT:-58080}:58080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      # 1.x defaulted to root even when DB_USER was absent from a custom .env.
      # Fresh 2.x environments explicitly write iptv_app via generate_env.py.
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Run python generate_env.py first}
      DB_NAME: ${DB_NAME:-iptv-all-in-one}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      IPTV_AUTH_USERNAME: ${IPTV_AUTH_USERNAME:-admin}
      IPTV_AUTH_PASSWORD: ${IPTV_AUTH_PASSWORD:-}
      IPTV_AUTH_REALM: ${IPTV_AUTH_REALM:-iptv-all-in-one}
      IPTV_SECRET_KEY: ${IPTV_SECRET_KEY:-}
      IPTV_TRUSTED_ORIGINS: ${IPTV_TRUSTED_ORIGINS:-}
      IPTV_INSECURE_TLS_HOSTS: ${IPTV_INSECURE_TLS_HOSTS:-}
      IPTV_OUTPUT_DIR: /app/output
      # Compatibility is the default so pulling a 2.x image cannot brick a
      # 1.x deployment. Set this to 1 after generate_env/migrate-2-0 succeeds.
      IPTV_REQUIRE_STRONG_CREDENTIALS: ${IPTV_REQUIRE_STRONG_CREDENTIALS:-0}
      TZ: Asia/Shanghai
    volumes:
      - app_data:/app/data
      - app_output:/app/output
    # Untouched 1.x environments may point at root-owned bind mounts/volumes.
    # Stay compatible by default; fresh 2.x environments generated by the
    # helper opt into UID 10001 and a read-only root filesystem explicitly.
    user: ${IPTV_CONTAINER_USER:-root}
    read_only: ${IPTV_HARDENED_CONTAINER:-false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    # Keep only the capability needed by compatibility root to reuse either
    # root-owned 1.x mounts or UID-10001-owned early-2.0 volumes. Fresh
    # deployments run as UID 10001, so this capability is not effective there.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    init: true
    restart: unless-stopped

  migrate-2-0:
    image: juzhic/iptv-all-in-one:latest
    profiles: ["migration"]
    # The image is read-only and intentionally does not contain or mount the
    # host .env. The host finalizes its staged values only after this succeeds.
    command: ["python", "/app/migrate_2_0.py", "--environment-only"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER_HOST: ${DB_USER_HOST:-%}
      # Profiles do not prevent Compose from interpolating service values.
      # Keep these optional here so an untouched 1.x .env can still run the
      # normal services; migrate_2_0.py validates every value when invoked.
      IPTV_MIGRATION_DB_USER: ${IPTV_MIGRATION_DB_USER:-}
      IPTV_MIGRATION_DB_PASSWORD: ${IPTV_MIGRATION_DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-iptv-all-in-one}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      IPTV_AUTH_PASSWORD: ${IPTV_AUTH_PASSWORD:-}
      IPTV_SECRET_KEY: ${IPTV_SECRET_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"

volumes:
  mysql_data:
  app_data:
  app_output:
