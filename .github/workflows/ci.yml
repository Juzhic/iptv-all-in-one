name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-db-password-with-32-bytes-2.0
          MYSQL_DATABASE: iptv_test
          MYSQL_USER: iptv_app
          MYSQL_PASSWORD: ci-app-db-password-with-32-bytes-2.0
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-db-password-with-32-bytes-2.0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: iptv_app
      DB_PASSWORD: ci-app-db-password-with-32-bytes-2.0
      DB_NAME: iptv_test
      IPTV_AUTH_USERNAME: ci-admin
      IPTV_AUTH_PASSWORD: ci-basic-auth-password-with-32-bytes-2.0
      IPTV_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-bytes-2.0
      IPTV_REQUIRE_STRONG_CREDENTIALS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q database engine scanner_integration web
      - name: Run backend unit and MySQL integration tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Enforce bundle budgets
        run: npm run check:size

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build candidate image
        run: docker build --tag iptv-test:ci .
      - name: Validate Compose for fresh and legacy environments
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          cp docker-compose.yml "$workdir/docker-compose.yml"
          cp .env.example generate_env.py "$workdir/"
          (
            cd "$workdir"
            python generate_env.py
            docker compose config --quiet
          )

          cat > "$workdir/.env" <<EOF
          DB_HOST=mysql
          DB_PORT=3306
          DB_PASSWORD=legacy-root-password
          DB_NAME=iptv-all-in-one
          EOF
          (
            cd "$workdir"
            docker compose config --quiet
          )
      - name: Start MySQL and application
        run: |
          docker network create iptv-ci-network
          docker run -d --name iptv-ci-mysql --network iptv-ci-network \
            -e MYSQL_ROOT_PASSWORD=ci-root-db-password-with-32-bytes-2.0 \
            -e MYSQL_DATABASE=iptv_test \
            -e MYSQL_USER=iptv_app \
            -e MYSQL_PASSWORD=ci-app-db-password-with-32-bytes-2.0 \
            mysql:8.4
          for attempt in $(seq 1 60); do
            if docker exec iptv-ci-mysql mysqladmin ping -h localhost -pci-root-db-password-with-32-bytes-2.0 --silent; then break; fi
            sleep 2
          done
          docker run -d --name iptv-ci-app --network iptv-ci-network -p 58080:58080 \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777 \
            --tmpfs /app/output:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0750 \
            --tmpfs /app/data:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0750 \
            -e DB_HOST=iptv-ci-mysql -e DB_PORT=3306 -e DB_NAME=iptv_test \
            -e DB_USER=iptv_app -e DB_PASSWORD=ci-app-db-password-with-32-bytes-2.0 \
            -e IPTV_AUTH_USERNAME=ci-admin \
            -e IPTV_AUTH_PASSWORD=ci-basic-auth-password-with-32-bytes-2.0 \
            -e IPTV_SECRET_KEY=ci-secret-key-with-at-least-thirty-two-bytes-2.0 \
            -e IPTV_REQUIRE_STRONG_CREDENTIALS=1 \
            iptv-test:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:58080/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs iptv-ci-app
          exit 1
      - name: Verify non-root and read-only runtime
        run: |
          set -euo pipefail
          docker inspect --format 'container={{.State.Status}} user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}}' iptv-ci-app
          docker exec iptv-ci-app sh -ec '
            fail() {
              echo "::error::$1" >&2
              exit 1
            }

            echo "Runtime identity: $(id)"
            [ "$(id -u)" != "0" ] || fail "Application container is running as root"

            for path in /app/output /app/data; do
              [ -d "$path" ] || fail "Required writable directory is missing: $path"
              stat -c "permission=%A mode=%a owner=%u:%g path=%n" "$path"
              [ -w "$path" ] || fail "Application user cannot write required directory: $path"
            done

            site=$(python -c "import site; print(site.getsitepackages()[0])")
            for path in /app/web/app.py /app/dist "$site"; do
              [ -e "$path" ] || fail "Required read-only path is missing: $path"
              stat -c "permission=%A mode=%a owner=%u:%g path=%n" "$path"
              [ ! -w "$path" ] || fail "Application user can modify protected path: $path"
            done

            echo "Runtime permission gate passed"
          '
          added_capabilities=$(docker inspect --format '{{json .HostConfig.CapAdd}}' iptv-ci-app)
          dropped_capabilities=$(docker inspect --format '{{json .HostConfig.CapDrop}}' iptv-ci-app)
          [ "$added_capabilities" = "null" ] || [ "$added_capabilities" = "[]" ] || {
            echo "::error::Hardened runtime unexpectedly adds capabilities: $added_capabilities" >&2
            exit 1
          }
          [ "$dropped_capabilities" = '["ALL"]' ] || {
            echo "::error::Hardened runtime did not drop all capabilities: $dropped_capabilities" >&2
            exit 1
          }
      - name: Verify idempotent migration and health
        run: |
          docker restart iptv-ci-app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:58080/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs iptv-ci-app
          exit 1
      - name: Verify legacy credentials remain boot-compatible
        run: |
          set -euo pipefail
          docker run -d --name iptv-ci-legacy --network iptv-ci-network -p 58081:58080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777 \
            --tmpfs /app/output:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0750 \
            --tmpfs /app/data:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0750 \
            -e DB_HOST=iptv-ci-mysql -e DB_PORT=3306 -e DB_NAME=iptv_test \
            -e DB_USER=root -e DB_PASSWORD=ci-root-db-password-with-32-bytes-2.0 \
            -e IPTV_REQUIRE_STRONG_CREDENTIALS=1 \
            iptv-test:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:58081/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:58081/api/health > /dev/null || {
            docker logs iptv-ci-legacy
            exit 1
          }
          docker logs iptv-ci-legacy 2>&1 | grep -F '临时凭据'
      - name: Verify first 2.0 Compose volume compatibility
        run: |
          set -euo pipefail
          docker volume create iptv-ci-v2-data >/dev/null
          docker volume create iptv-ci-v2-output >/dev/null
          docker run --rm --user root \
            -v iptv-ci-v2-data:/app/data \
            -v iptv-ci-v2-output:/app/output \
            iptv-test:ci sh -ec '
              chown 10001:10001 /app/data /app/output
              chmod 0750 /app/data /app/output
            '
          docker run --rm --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777 \
            -v iptv-ci-v2-data:/app/data \
            -v iptv-ci-v2-output:/app/output \
            iptv-test:ci sh -ec '
              [ "$(id -u)" = "10001" ]
              touch /app/data/first-v2-write-test
              touch /app/output/first-v2-write-test
            '
      - name: Verify legacy Compose startup and writable named volumes
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cleanup_legacy_compose() {
            COMPOSE_PROJECT_NAME=iptvlegacy docker compose \
              -f "$workdir/docker-compose.yml" --env-file "$workdir/.env" \
              down -v 2>/dev/null || true
            rm -rf "$workdir"
          }
          trap cleanup_legacy_compose EXIT
          cp docker-compose.yml "$workdir/docker-compose.yml"
          cat > "$workdir/.env" <<EOF
          DB_HOST=mysql
          DB_PORT=3306
          DB_PASSWORD=legacy-pass
          DB_NAME=iptv-all-in-one
          PORT=58082
          EOF
          sed -i 's#image: juzhic/iptv-all-in-one:latest#image: iptv-test:ci#g' "$workdir/docker-compose.yml"

          # Simulate data volumes created by the first 2.0 image, which used
          # UID/GID 10001 and mode 0750. Compatibility root must be able to
          # reuse them as well as root-owned 1.x bind mounts.
          (
            cd "$workdir"
            export COMPOSE_PROJECT_NAME=iptvlegacy
            docker compose create
          )
          for volume in iptvlegacy_app_data iptvlegacy_app_output; do
            docker run --rm --user root -v "$volume:/target" iptv-test:ci \
              sh -ec 'chown 10001:10001 /target && chmod 0750 /target'
          done
          (
            cd "$workdir"
            export COMPOSE_PROJECT_NAME=iptvlegacy
            docker compose up -d
            for attempt in $(seq 1 60); do
              if docker compose exec -T mysql mysqladmin ping -h localhost \
                -plegacy-pass --silent >/dev/null 2>&1 \
                && curl --fail --silent http://127.0.0.1:58082/api/health > /dev/null; then
                break
              fi
              sleep 2
            done
            docker compose exec -T mysql mysqladmin ping -h localhost \
              -plegacy-pass --silent
            curl --fail --silent http://127.0.0.1:58082/api/health > /dev/null
            docker compose logs --no-color iptv-all-in-one 2>&1 | grep -F '临时凭据'
            docker compose exec -T iptv-all-in-one sh -ec '
              [ "$(id -u)" = "0" ]
              touch /app/data/legacy-compose-write-test
              touch /app/output/legacy-compose-write-test
              touch /app/legacy-rootfs-write-test
              rm /app/legacy-rootfs-write-test
            '
          )
      - name: Scan candidate image for high and critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.2 image --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed --scanners vuln --no-progress iptv-test:ci
      - name: Show container logs on failure
        if: failure()
        run: docker logs iptv-ci-app || true
      - name: Cleanup smoke containers
        if: always()
        run: |
          docker rm -f iptv-ci-app iptv-ci-legacy iptv-ci-mysql 2>/dev/null || true
          docker volume rm iptv-ci-v2-data iptv-ci-v2-output 2>/dev/null || true
          docker network rm iptv-ci-network 2>/dev/null || true
