name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: iptv_admin
          POSTGRES_PASSWORD: ci-admin-db-password-with-32-bytes-3.0
          POSTGRES_DB: iptv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U iptv_admin -d iptv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: iptv_app
      DB_PASSWORD: ci-app-db-password-with-32-bytes-3.0
      DB_NAME: iptv_test
      IPTV_AUTH_USERNAME: ci-admin
      IPTV_AUTH_PASSWORD: ci-basic-auth-password-with-32-bytes-3.0
      IPTV_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-bytes-3.0
      IPTV_REQUIRE_STRONG_CREDENTIALS: '1'
      IPTV_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Create the least-privileged application role
        env:
          PG_ADMIN_PASSWORD: ci-admin-db-password-with-32-bytes-3.0
        run: |
          set -euo pipefail
          postgres_container='${{ job.services.postgres.id }}'
          docker exec -i -e PGPASSWORD="$PG_ADMIN_PASSWORD" "$postgres_container" \
            psql -U iptv_admin -d postgres --set=ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'iptv_app') THEN
              CREATE ROLE iptv_app LOGIN
                PASSWORD 'ci-app-db-password-with-32-bytes-3.0'
                NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $do$;
          ALTER DATABASE iptv_test OWNER TO iptv_app;
          \connect iptv_test
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          GRANT USAGE, CREATE ON SCHEMA public TO iptv_app;
          SQL
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q database engine scanner_integration web
      - name: Run backend unit and PostgreSQL 18 integration tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Enforce bundle budgets
        run: npm run check:size

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Verify amd64 and arm64 image builds
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the native smoke-test image
        run: docker build --tag iptv-test:ci .
      - name: Render and validate the single-file deployment
        run: |
          set -euo pipefail
          mkdir ci-compose
          cp docker-compose.yml ci-compose/docker-compose.yml
          sed -i \
            -e 's#__POSTGRES_ADMIN_PASSWORD__#ci-admin-db-password-with-32-bytes-3.0#g' \
            -e 's#__POSTGRES_APP_PASSWORD__#ci-app-db-password-with-32-bytes-3.0#g' \
            -e 's#__IPTV_AUTH_PASSWORD__#ci-basic-auth-password-with-32-bytes-3.0#g' \
            -e 's#__IPTV_SECRET_KEY__#ci-secret-key-with-at-least-thirty-two-bytes-3.0#g' \
            -e 's#juzhic/iptv-all-in-one:3.0.0#iptv-test:ci#g' \
            ci-compose/docker-compose.yml
          docker compose -f ci-compose/docker-compose.yml config --quiet
          if grep -Eq '__[A-Z0-9_]+__' ci-compose/docker-compose.yml; then
            echo '::error::Generated Compose still contains replacement tokens' >&2
            exit 1
          fi
      - name: Start PostgreSQL 18 and the application
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=iptvci
          compose=(docker compose -f ci-compose/docker-compose.yml)
          "${compose[@]}" up -d
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:58080/api/health >/dev/null; then
              init_container=$("${compose[@]}" ps -aq postgres-init)
              test -n "$init_container"
              test "$(docker inspect --format '{{.State.ExitCode}}' "$init_container")" = 0
              exit 0
            fi
            sleep 2
          done
          "${compose[@]}" ps --all
          "${compose[@]}" logs --no-color
          exit 1
      - name: Verify database roles, extension, and idempotent initialization
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=iptvci
          compose=(docker compose -f ci-compose/docker-compose.yml)
          postgres_container=$("${compose[@]}" ps -q postgres)

          role_flags=$(docker exec -e PGPASSWORD=ci-admin-db-password-with-32-bytes-3.0 \
            "$postgres_container" psql -h 127.0.0.1 -U iptv_admin -d postgres -At \
            -c "SELECT rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = 'iptv_app'")
          test "$role_flags" = 'f|f|f'
          database_owner=$(docker exec -e PGPASSWORD=ci-admin-db-password-with-32-bytes-3.0 \
            "$postgres_container" psql -h 127.0.0.1 -U iptv_admin -d postgres -At \
            -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'iptv_all_in_one'")
          test "$database_owner" = 'iptv_app'
          docker exec -e PGPASSWORD=ci-app-db-password-with-32-bytes-3.0 \
            "$postgres_container" psql -h 127.0.0.1 -U iptv_app -d iptv_all_in_one -At \
            -c "SELECT extname FROM pg_extension WHERE extname = 'pgcrypto'" | grep -Fx pgcrypto

          "${compose[@]}" run --rm postgres-init
          docker exec -e PGPASSWORD=ci-app-db-password-with-32-bytes-3.0 \
            "$postgres_container" psql -h 127.0.0.1 -U iptv_app -d iptv_all_in_one -At \
            -c 'SELECT 1' | grep -Fx 1
      - name: Verify authentication and anonymous feeds
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:58080/api/config)" = 401
          curl --fail --silent --show-error \
            --user admin:ci-basic-auth-password-with-32-bytes-3.0 \
            http://127.0.0.1:58080/api/config >/tmp/config-before-restart.json
          curl --fail --silent --show-error http://127.0.0.1:58080/api/subscribe.m3u \
            >/tmp/anonymous-playlist.m3u
          grep -F '#EXTM3U' /tmp/anonymous-playlist.m3u
      - name: Verify network isolation and hardened containers
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=iptvci
          compose=(docker compose -f ci-compose/docker-compose.yml)
          postgres_container=$("${compose[@]}" ps -q postgres)
          app_container=$("${compose[@]}" ps -q iptv-all-in-one)

          test "$(docker port "$postgres_container" 5432/tcp)" = '127.0.0.1:5432'
          test "$(docker network inspect iptvci_db_internal --format '{{.Internal}}')" = true
          app_networks=$(docker inspect "$app_container" \
            --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}')
          case "$app_networks" in
            *iptvci_db_internal*iptvci_egress*|*iptvci_egress*iptvci_db_internal*) ;;
            *) echo "::error::Unexpected app networks: $app_networks" >&2; exit 1 ;;
          esac

          test "$(docker inspect "$app_container" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect "$app_container" --format '{{json .HostConfig.CapDrop}}')" = '["ALL"]'
          added=$(docker inspect "$app_container" --format '{{json .HostConfig.CapAdd}}')
          test "$added" = null || test "$added" = '[]'
          test "$(docker inspect "$app_container" --format '{{.Config.User}}')" = '10001:10001'
          docker inspect "$postgres_container" --format '{{json .HostConfig.SecurityOpt}}' \
            | grep -F 'no-new-privileges'
          docker exec "$app_container" sh -ec '
            test "$(id -u)" = 10001
            touch /app/data/ci-write-test /app/output/ci-write-test
            python -c "import socket; socket.create_connection((\"example.com\", 443), 10).close()"
            if touch /app/rootfs-must-be-read-only 2>/dev/null; then
              echo "root filesystem is writable" >&2
              exit 1
            fi
          '
      - name: Verify persistence and database reconnect
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=iptvci
          compose=(docker compose -f ci-compose/docker-compose.yml)
          postgres_container=$("${compose[@]}" ps -q postgres)
          docker exec -e PGPASSWORD=ci-app-db-password-with-32-bytes-3.0 \
            "$postgres_container" psql -h 127.0.0.1 -U iptv_app -d iptv_all_in_one \
            --set=ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS ci_persistence_marker (value text PRIMARY KEY); INSERT INTO ci_persistence_marker VALUES ('survives-restart') ON CONFLICT DO NOTHING;"

          "${compose[@]}" restart postgres
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --user admin:ci-basic-auth-password-with-32-bytes-3.0 \
              http://127.0.0.1:58080/api/config >/tmp/config-after-restart.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            --user admin:ci-basic-auth-password-with-32-bytes-3.0 \
            http://127.0.0.1:58080/api/config >/dev/null
          docker exec -e PGPASSWORD=ci-app-db-password-with-32-bytes-3.0 \
            "$postgres_container" psql -h 127.0.0.1 -U iptv_app -d iptv_all_in_one -At \
            -c 'SELECT value FROM ci_persistence_marker' | grep -Fx survives-restart
      - name: Scan candidate image for high and critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.2 image --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed --scanners vuln --no-progress iptv-test:ci
      - name: Show service logs on failure
        if: failure()
        run: |
          COMPOSE_PROJECT_NAME=iptvci docker compose -f ci-compose/docker-compose.yml \
            ps --all || true
          COMPOSE_PROJECT_NAME=iptvci docker compose -f ci-compose/docker-compose.yml \
            logs --no-color || true
      - name: Cleanup smoke deployment
        if: always()
        run: |
          COMPOSE_PROJECT_NAME=iptvci docker compose -f ci-compose/docker-compose.yml \
            down --volumes --remove-orphans 2>/dev/null || true
