name: Test and Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 '^\#\# \[' CHANGELOG.md | sed 's/.*\[\(.*\)\].*/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Merge project description and changelog
        run: cat DOCKERHUB.md CHANGELOG.md > dockerhub_readme.md

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iptv-all-in-one:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iptv-all-in-one:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          username = os.environ['DOCKERHUB_USERNAME']
          password = os.environ['DOCKERHUB_TOKEN']
          login = urllib.request.Request(
              'https://hub.docker.com/v2/users/login/',
              data=json.dumps({'username': username, 'password': password}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(login) as response:
              token = json.load(response)['token']
          readme = open('dockerhub_readme.md', encoding='utf-8').read()
          payload = json.dumps({
              'full_description': readme,
              'description': 'IPTV 频道测速 + 扫描发现一站式工具，支持多源聚合、FFmpeg 检测、定时运行和 Docker 部署',
          }).encode()
          update = urllib.request.Request(
              f'https://hub.docker.com/v2/repositories/{username}/iptv-all-in-one/',
              data=payload,
              method='PATCH',
              headers={'Authorization': f'JWT {token}', 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(update) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'Docker Hub update failed: HTTP {response.status}')
          PY
