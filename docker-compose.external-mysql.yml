services:
  iptv-all-in-one:
    image: juzhic/iptv-all-in-one:latest
    container_name: iptv-all-in-one
    command: ["gunicorn", "-w", "1", "--worker-class", "gthread", "--threads", "8", "-b", "0.0.0.0:58080", "--timeout", "120", "web:app"]
    # Security risk: the management UI is intentionally published on every
    # host interface. Protect the host with a firewall/VPN/reverse proxy.
    # Anonymous playlist endpoints are readable by every client reaching it.
    ports:
      - "${PORT:-58080}:58080"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?Set a dedicated non-root DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Run python generate_env.py or set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-iptv-all-in-one}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      IPTV_AUTH_USERNAME: ${IPTV_AUTH_USERNAME:-admin}
      IPTV_AUTH_PASSWORD: ${IPTV_AUTH_PASSWORD:?Run python generate_env.py first}
      IPTV_AUTH_REALM: ${IPTV_AUTH_REALM:-iptv-all-in-one}
      IPTV_SECRET_KEY: ${IPTV_SECRET_KEY:?Run python generate_env.py first}
      IPTV_TRUSTED_ORIGINS: ${IPTV_TRUSTED_ORIGINS:-}
      IPTV_INSECURE_TLS_HOSTS: ${IPTV_INSECURE_TLS_HOSTS:-}
      IPTV_OUTPUT_DIR: /app/output
      IPTV_REQUIRE_STRONG_CREDENTIALS: "1"
      TZ: Asia/Shanghai
    volumes:
      - app_data:/app/data
      - app_output:/app/output
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

volumes:
  app_data:
  app_output:
